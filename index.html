<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISTEM DISTRIBUSI KALENDER PPRM</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#1f7a3a;--g2:#2e9a4d;--gold:#f2c230;--bg:#f2f8e6;--card:#fff;--tx:#18241f;--mu:#68766f;--bd:#dfe5e0;--red:#b3392f;--ok:#1d7a4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10200f;--card:#193019;--tx:#f1f6e4;--mu:#a9bf9a;--bd:#2f4a2c;--g:#14572a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;display:flex;min-height:100vh}
nav{width:220px;background:linear-gradient(180deg,#1f7a3a,#14572a);color:#fff;padding:18px 12px;flex-shrink:0}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0 4px 16px}.brand img{width:86px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}nav h1{font-size:14px;line-height:1.3;margin:10px 0 0;color:var(--gold);font-weight:800;letter-spacing:.3px}
nav a{display:block;padding:9px 10px;border-radius:7px;color:#d5e3dc;text-decoration:none;cursor:pointer;margin-bottom:2px}
nav a.on{background:var(--g2);color:#fff;border-left:3px solid var(--gold)}
nav select{width:100%;margin-top:14px}
main{flex:1;padding:22px;min-width:0}
h2{margin:0 0 14px;font-size:22px;font-weight:800}h3{margin:18px 0 8px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--gold);border-radius:8px;padding:12px}
.st b{display:block;font-size:20px;margin-top:4px}.st span{color:var(--mu);font-size:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:500;font-size:12px}
form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{font:inherit;font-weight:700;background:var(--g);color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer}
button.s{background:none;color:var(--g2);border:1px solid var(--bd);padding:4px 8px;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e0f3cf;color:#1b6b30}.tag.r{background:#f6e1de;color:var(--red)}.tag.y{background:#fff0b3;color:#7a5c00}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--g);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:9}
.note{color:var(--mu);font-size:12px}
details.dd{position:relative}details.dd summary{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer;font-size:14px;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}details.dd summary::-webkit-details-marker{display:none}details.dd summary::after{content:"\25BE";float:right;color:var(--mu)}.ddl{position:absolute;z-index:5;left:0;right:0;margin-top:2px;max-height:180px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:14px;padding:3px 0}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px;padding:10px}nav .brand{width:100%;flex-direction:row;gap:8px;text-align:left;margin:0 0 4px}nav .brand img{width:40px}nav h1{margin:0;font-size:13px}nav a{margin:0;padding:6px 9px}nav select{margin:0}}
#strukwrap{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);overflow:auto;padding:16px}#strukwrap.on{display:block}
.struk{max-width:520px;margin:0 auto;background:#fff;color:#111;border-radius:8px;padding:22px;font-size:13px}.struk h2{text-align:center;margin:0 0 2px;font-size:18px}.struk .sub{text-align:center;color:#555;font-size:12px;margin-bottom:12px}
.struk table td{border:0;padding:3px 0;white-space:normal;vertical-align:top}.struk table td:first-child{width:38%;color:#555}.struk .amt{font-size:20px;font-weight:800;border:2px solid #111;border-radius:6px;padding:8px 12px;margin:12px 0;text-align:center}
.struk .sig{display:flex;justify-content:space-between;margin-top:34px;text-align:center}.struk .sig div{width:44%;border-top:1px solid #111;padding-top:4px;font-size:12px}.struk hr{border:0;border-top:1px dashed #999;margin:12px 0}
.struk-btns{max-width:520px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
@media print{body:has(#strukwrap.on)>*:not(#strukwrap){display:none!important}#strukwrap{position:static;display:block;background:none;padding:0}.struk{border-radius:0;max-width:none;padding:0}.struk-btns{display:none!important}}
@media print{nav,button,.row,form{display:none!important}body{display:block}.kop{display:flex!important;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px;color:#000}.kop img{width:60px;height:auto}.kop b{font-size:16px;display:block}}
.kop{display:none}.who{margin-top:14px;padding:10px 4px 0;border-top:1px solid #ffffff33;font-size:13px;display:flex;flex-direction:column;gap:2px}.who small{color:var(--gold)}.who .row{margin:8px 0 0}.who button.s{color:#fff;border-color:#ffffff66;background:none;padding:4px 8px}
.login{max-width:380px;margin:6vh auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:26px;text-align:center}.login img{width:100px;height:auto}.login h2{font-size:17px;margin:10px 0 6px}.login form{grid-template-columns:1fr;text-align:left;margin-top:12px}
@media(max-width:760px){.who{width:100%;margin-top:6px;padding:6px 0 0}}.rk{display:flex;gap:10px;align-items:center}.ins{margin:0;padding-left:18px}.ins li{margin:5px 0;line-height:1.5}
</style></head><body>

function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
// Setiap angka dihitung dari riwayat transaksi, tidak ada angka stok yang diubah langsung.
function calc(name){
 var L=live(),me=function(t){return t.off===name};
 var recv=sum(L.filter(function(t){return t.type==='dist'&&me(t)}),function(t){return t.qty});
 var tin=sum(L.filter(function(t){return t.type==='alih'&&t.to===name}),function(t){return t.qty});
 var sold=sum(L.filter(function(t){return t.type==='jual'&&me(t)}),function(t){return t.qty});
 var out=sum(L.filter(function(t){return t.type==='alih'&&me(t)}),function(t){return t.qty});
 var ob=sum(L.filter(function(t){return t.type==='jual'&&me(t)}),function(t){return t.qty*t.price});
 var paid=sum(L.filter(function(t){return t.type==='bayar'&&me(t)}),function(t){return t.amt});
 var ret=sum(L.filter(function(t){return t.type==='retur'&&me(t)}),function(t){return t.qty});var dist0=recv;recv=dist0+tin-out-ret;var stock=recv-sold,rest=ob-paid;
 var status=ob===0&&paid===0?'BELUM ADA PEMBAYARAN':(paid===0?'BELUM ADA PEMBAYARAN':(rest<=0?'LUNAS':'BELUM LUNAS'));
 if(ob>0&&paid>=ob)status='LUNAS';
 return {ret:ret,dist0:dist0,recv:recv,tin:tin,sold:sold,out:out,stock:stock,ob:ob,paid:paid,rest:rest,pct:ob?Math.min(100,paid/ob*100):0,status:status}}
function tag(s){return '<span class="tag '+(s==='LUNAS'?'':s==='BELUM LUNAS'?'y':'r')+'">'+s+'</span>'}
// ===== Lapisan data (Supabase) =====
function fromRow(r){return {no:r.no,type:r.type,off:r.off||'',wil:r.wil||'',to:r.to_off||'',toWil:r.to_wil||'',qty:+r.qty||0,price:+r.price||0,amt:+r.amt||0,note:r.note||'',method:r.method||'',ts:+r.ts,admin:r.admin||'',void:r.void||undefined,edits:r.edits||undefined}}
function toRow(t){var r={type:t.type,off:t.off||'',wil:t.wil||'',to_off:t.to||'',to_wil:t.toWil||'',qty:Math.round(t.qty||0),price:Math.round(t.price||0),amt:Math.round(t.amt||0),note:t.note||'',method:t.method||'',ts:t.ts,admin:t.admin||'',void:t.void||null,edits:t.edits||null};if(t.no)r.no=t.no;return r}
async function fetchAll(q){var out=[],i=0;for(;;){var r=await q().range(i,i+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)break;i+=1000}return out}
async function loadAll(){
 var adm=ME&&ME.role==='admin';
 var res=await Promise.all([
  fetchAll(function(){return DB.from('transaksi').select('*').order('ts',{ascending:true}).order('id',{ascending:true})}),
  DB.from('petugas').select('*').order('nama'),
  DB.from('wilayah').select('nama').order('nama'),
  DB.from('pengaturan').select('harga').eq('id',1).maybeSingle(),
  adm?DB.from('profiles').select('*').order('created_at'):Promise.resolve({data:[]})]);
 for(var k=1;k<res.length;k++)if(res[k].error)throw res[k].error;
 S.tx=res[0].map(fromRow);
 S.off=res[1].data.map(function(o){return {nama:o.nama,hp:o.hp||'',alamat:o.alamat||'',wil:o.wil||[],mulai:o.mulai||'',status:o.status||'Aktif',ket:o.ket||''}});
 S.wil=res[2].data.map(function(w){return w.nama});
 S.harga=(res[3].data&&+res[3].data.harga)||50000;
 PROF=res[4].data||[];S.admin=ME.nama||ME.email||'Admin'}
async function sync(){if(ME)await loadAll()}
function fail(x){console.error(x);toast('Gagal: '+((x&&x.message)||x));if(ME)sync().then(function(){draw()},function(){})}
function wr(fn){return Promise.resolve().then(fn).then(function(){draw()},fail)}
async function add(t){t.ts=Date.now();t.admin=S.admin;var r=await DB.from('transaksi').insert(toRow(t)).select().single();if(r.error)throw r.error;var n=fromRow(r.data);S.tx.push(n);toast('Tersimpan: '+n.no);return n}
// Buat akun login baru lewat klien terpisah (sesi admin tidak terganggu), lalu atur peran/tautannya.
async function mkUser(email,pw,upd){
 var c2=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 var r=await c2.auth.signUp({email:email,password:pw});
 if(r.error)throw r.error;
 var u=r.data&&r.data.user;if(!u||!u.id)throw new Error('Akun gagal dibuat');
 if(u.identities&&u.identities.length===0)throw new Error('Email sudah terdaftar');
 var p=await DB.from('profiles').update(upd).eq('id',u.id);if(p.error)throw p.error;
 if(!r.data.session)toast('Akun dibuat, tetapi perlu konfirmasi email. Matikan "Confirm email" di Supabase agar langsung bisa masuk.');
 return u}
function akunOf(n){var p=PROF.find(function(x){return x.petugas_nama===n});return p?esc(p.email):'<span class="note">belum ada</span>'}
function akunBox(o){var p=PROF.find(function(x){return x.petugas_nama===o.nama}),i=S.off.indexOf(o);
 return '<div class="box"><h3>Akun login petugas</h3>'+(p?'<p>Email: <b>'+esc(p.email)+'</b></p><p class="note">Petugas masuk dengan email ini. Kata sandi dapat diganti sendiri lewat tombol Ganti sandi.</p>':'<form onsubmit="return makeAkun(event,'+i+')"><label>Email<input type="email" name="email" required></label><label>Kata sandi (min. 6)<input type="password" name="pw" minlength="6" required autocomplete="new-password"></label><button>Buat akun login</button></form><p class="note">Petugas ini belum punya akun. Setelah dibuat, berikan email dan kata sandi kepada petugas.</p>')+'</div>'}
function makeAkun(e,i){e.preventDefault();var o=S.off[i],f=new FormData(e.target),em=f.get('email').trim(),pw=f.get('pw');if(!o)return false;wr(async function(){await mkUser(em,pw,{role:'petugas',petugas_nama:o.nama,nama:o.nama});await sync();toast('Akun login dibuat')});return false}
function adminBox(){var A=PROF.filter(function(p){return p.role==='admin'});
 return '<div class="box"><h3>Akun admin</h3>'+table(['Email','Nama'],A.map(function(p){return [esc(p.email),esc(p.nama||'')]}))+'<form onsubmit="return addAdmin(event)" style="margin-top:10px"><label>Email admin baru<input type="email" name="email" required></label><label>Kata sandi (min. 6)<input type="password" name="pw" minlength="6" required autocomplete="new-password"></label><button>Tambah admin</button></form></div>'}
function addAdmin(e){e.preventDefault();var f=new FormData(e.target),em=f.get('email').trim(),pw=f.get('pw');wr(async function(){await mkUser(em,pw,{role:'admin',nama:em.split('@')[0]});await sync();toast('Admin ditambahkan')});return false}
function savePeng(e){e.preventDefault();var a=e.target.a.value.trim()||S.admin,h=Math.round(+e.target.h.value)||0;wr(async function(){var r=await DB.from('profiles').update({nama:a}).eq('id',ME.id);if(r.error)throw r.error;var q=await DB.from('pengaturan').update({harga:h}).eq('id',1);if(q.error)throw q.error;ME.nama=a;S.admin=a;S.harga=h;toast('Pengaturan disimpan')});return false}
// ===== Login / sesi =====
function drawGate(){var ok=!!(SUPA_URL&&SUPA_KEY&&window.supabase&&DB);
 $('#main').innerHTML='<div class="login"><img src="'+LOGO+'" alt="Logo PPRM"><h2>SISTEM DISTRIBUSI KALENDER PPRM</h2>'+(ok?'<p class="note">Masuk dengan email dan kata sandi dari admin.</p><form onsubmit="return doLogin(event)"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Kata sandi<input type="password" name="pw" required autocomplete="current-password"></label><button>Masuk</button></form>':'<p class="note">Aplikasi belum dihubungkan ke database. Isi <b>SUPA_URL</b> dan <b>SUPA_KEY</b> di bagian awal berkas ini (lihat PETUNJUK-SETUP.md).</p>')+'</div>'}
function doLogin(e){e.preventDefault();var f=new FormData(e.target);DB.auth.signInWithPassword({email:f.get('email').trim(),password:f.get('pw')}).then(function(r){if(r.error){toast('Gagal masuk: email atau kata sandi salah');return}return enter(r.data.user)}).catch(function(x){console.error(x);toast('Gagal: '+((x&&x.message)||x))});return false}
async function enter(u){var p=await DB.from('profiles').select('*').eq('id',u.id).maybeSingle();if(p.error)throw p.error;ME=p.data||{id:u.id,email:u.email,role:'petugas'};await loadAll();role=ME.role==='admin'?'admin':(ME.petugas_nama||'');view='dash';sel=null;draw()}
async function logout(){try{await DB.auth.signOut()}catch(x){}ME=null;PROF=[];S={off:[],wil:[],tx:[],seq:{},admin:'Admin',harga:50000};role='admin';view='dash';sel=null;ed=null;draw()}
function refresh(){sync().then(function(){draw();toast('Data dimuat ulang')},fail)}
function pwd(){$('#strukwrap').innerHTML='<div class="struk" style="max-width:360px"><h2>Ganti kata sandi</h2><form onsubmit="return savePwd(event)" style="grid-template-columns:1fr;margin-top:12px"><label>Kata sandi baru (min. 6)<input type="password" name="p1" minlength="6" required autocomplete="new-password"></label><label>Ulangi kata sandi<input type="password" name="p2" minlength="6" required autocomplete="new-password"></label><div class="row"><button>Simpan</button><button type="button" class="s" onclick="tutupBukti()">Batal</button></div></form></div>';$('#strukwrap').className='on'}
function savePwd(e){e.preventDefault();var f=new FormData(e.target),a=f.get('p1');if(a!==f.get('p2'))return toast('Kata sandi tidak sama'),false;DB.auth.updateUser({password:a}).then(function(r){if(r.error)return fail(r.error);tutupBukti();toast('Kata sandi diganti')},fail);return false}
async function boot(){
 $('#main').innerHTML='<p class="note">Memuat...</p>';nav();
 if(!SUPA_URL||!SUPA_KEY||!window.supabase)return drawGate();
 try{DB=supabase.createClient(SUPA_URL,SUPA_KEY);var g=await DB.auth.getSession();
  if(g.data&&g.data.session)await enter(g.data.session.user);else draw()}
 catch(x){console.error(x);draw();toast('Gagal terhubung: '+((x&&x.message)||x))}}
var TYPE={dist:'Distribusi',jual:'Penjualan',bayar:'Pembayaran',alih:'Pengalihan',stok:'Tambah Stok',retur:'Pengembalian Stok',koreksi:'Koreksi'};
var role='admin',view='dash',sel=null,ed=null,flt={q:'',type:'',wil:'',from:'',to:'',sort:'desc'};
var MENU=[['dash','Dashboard'],['off','Data Petugas'],['wil','Wilayah Distribusi'],['dist','Distribusi Kalender'],['jual','Penjualan Kalender'],['stok','Stok Kalender'],['bayar','Pembayaran'],['alih','Pengalihan Stok'],['riw','Riwayat Transaksi'],['riset','Riset Data'],['lap','Laporan'],['set','Pengaturan']];
function nav(){
 var h='<div class="brand"><img src="'+LOGO+'" alt="Logo PPRM"><h1>SISTEM DISTRIBUSI KALENDER PPRM</h1></div>';
 if(ME){
  if(role==='admin')MENU.forEach(function(m){h+='<a class="'+(view===m[0]?'on':'')+'" onclick="go(\''+m[0]+'\')">'+m[1]+'</a>'});
  h+='<div class="who"><b>'+esc(ME.nama||ME.email||'')+'</b><small>'+(ME.role==='admin'?'Admin':'Petugas')+'</small><div class="row"><button class="s" onclick="refresh()">Muat ulang</button><button class="s" onclick="pwd()">Ganti sandi</button><button class="s" onclick="logout()">Keluar</button></div></div>'}
 $('#nav').innerHTML=h}
function go(v){view=v;sel=null;ed=null;draw()}
function opts(arr,v){return arr.map(function(x){return '<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>'}).join('')}
function table(h,rows){return '<div class="tw"><table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+(rows.length?rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="'+h.length+'" class="note">Belum ada data. Mulai dengan menambah data lewat formulir di atas.</td></tr>')+'</table></div>'}
function stat(l,v){return '<div class="st"><span>'+l+'</span><b>'+v+'</b></div>'}
function txRow(t){return [esc(t.no),dt(t.ts),esc(t.off||''),esc(t.wil||''),TYPE[t.type],t.qty||'',t.amt?rp(t.amt):(t.qty&&t.price?rp(t.qty*t.price):''),esc(t.note||'')+(t.type==='alih'?' (ke '+esc(t.to)+')':'')+(t.edits&&t.edits.length?' <span class="tag y" title="Diedit '+t.edits.length+'x, terakhir: '+esc(t.edits[t.edits.length-1].reason)+'">DIEDIT</span>':'')+(t.void?' <span class="tag r">DIBATALKAN: '+esc(t.void.reason)+'</span>':''),esc(t.admin)]}
function monthly(arr,f){var m={};arr.forEach(function(t){var k=new Date(t.ts).toISOString().slice(0,7);m[k]=(m[k]||0)+f(t)});return m}
function bars(m,fmt){var ks=Object.keys(m).sort(),mx=Math.max.apply(null,ks.map(function(k){return m[k]}).concat([1]));return ks.length?ks.map(function(k){return '<div class="row" style="margin:4px 0;align-items:center"><span style="width:70px">'+k+'</span><div class="bar" style="flex:1"><i style="width:'+m[k]/mx*100+'%"></i></div><span style="width:110px;text-align:right">'+fmt(m[k])+'</span></div>'}).join(''):'<p class="note">Belum ada data.</p>'}
// Stok pusat diisi admin: masuk - didistribusikan + dikembalikan petugas.
function pusat(){var L=live(),q=function(t){return t.qty},m=sum(L.filter(function(t){return t.type==='stok'}),q),d=sum(L.filter(function(t){return t.type==='dist'}),q),r=sum(L.filter(function(t){return t.type==='retur'}),q);return {masuk:m,dist:d,ret:r,sisa:m-d+r}}
function all(){var a={ret:0,recv:0,tin:0,sold:0,out:0,stock:0,ob:0,paid:0,rest:0,lunas:0,belum:0};S.off.forEach(function(o){var c=calc(o.nama);['ret','recv','tin','sold','out','stock','ob','paid','rest'].forEach(function(k){a[k]+=c[k]});if(c.status==='LUNAS')a.lunas++;else a.belum++});return a}
var V={};
V.dash=function(){var a=all(),L=live();
 return '<h2>Dashboard</h2><div class="grid">'+stat('Stok pusat tersedia',pusat().sisa)+stat('Total stok masuk',pusat().masuk)+stat('Kalender didistribusikan',a.recv)+stat('Terjual',a.sold)+stat('Belum terjual (stok)',a.stock)+stat('Dialihkan',sum(L.filter(function(t){return t.type==='alih'}),function(t){return t.qty}))+stat('Nilai penjualan',rp(a.ob))+stat('Kewajiban setoran',rp(a.ob))+stat('Pembayaran diterima',rp(a.paid))+stat('Sisa kewajiban',rp(a.rest))+stat('Petugas',S.off.length)+stat('Lunas',a.lunas)+stat('Belum lunas',a.belum)+stat('Transaksi bayar',L.filter(function(t){return t.type==='bayar'}).length)+stat('Transaksi alih',L.filter(function(t){return t.type==='alih'}).length)+'</div>'
 +'<div class="box"><h3>Distribusi per bulan (eksemplar)</h3>'+bars(monthly(L.filter(function(t){return t.type==='dist'}),function(t){return t.qty}),String)+'<h3>Penjualan per bulan</h3>'+bars(monthly(L.filter(function(t){return t.type==='jual'}),function(t){return t.qty*t.price}),rp)+'<h3>Pembayaran per bulan</h3>'+bars(monthly(L.filter(function(t){return t.type==='bayar'}),function(t){return t.amt}),rp)+'<h3>Kewajiban vs pembayaran</h3><div class="bar"><i style="width:'+(a.ob?Math.min(100,a.paid/a.ob*100):0)+'%"></i></div><p class="note">'+rp(a.paid)+' dari '+rp(a.ob)+'</p></div>'}
V.off=function(){
 if(sel)return detail(sel,true);
 return '<h2>Data Petugas</h2><div class="box"><form onsubmit="return addOff(event)"><label>Nama lengkap<input name="nama" required></label><label>No. HP (opsional)<input name="hp"></label><label>Alamat (opsional)<input name="alamat"></label><div style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)">Wilayah (pilih dari data wilayah)'+wilPick()+'</div><label>Mulai bertugas<input type="date" name="mulai"></label><label>Status<select name="status"><option>Aktif</option><option>Nonaktif</option></select></label><label>Keterangan<input name="ket"></label><label>Email login (opsional)<input type="email" name="email"></label><label>Kata sandi login (min. 6)<input type="password" name="pw" minlength="6" autocomplete="new-password"></label><button>Simpan petugas</button></form></div><div class="box">'+table(['Nama','Wilayah','Status','Akun login','Stok','Sisa kewajiban','Pembayaran',''],S.off.map(function(o,i){var c=calc(o.nama);return [esc(o.nama),esc(o.wil.join(', ')),o.status,akunOf(o.nama),c.stock,rp(c.rest),tag(c.status),'<button class="s" onclick="sel=\''+esc(o.nama)+'\';draw()">Detail</button> <button class="s" style="color:var(--red)" onclick="delOff('+i+')">Hapus</button>']}))+'</div>'}
// Satu petugas bisa memegang beberapa wilayah: ubah wilayah petugas + pilihan wilayah di form mengikuti petugas.
function wilEdit(o){return '<div class="box"><h3>Wilayah yang dipegang</h3><form onsubmit="return saveWilOff(event,'+S.off.indexOf(o)+')"><div style="display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)">Pilih satu atau beberapa wilayah'+wilPick(o.wil||[])+'</div><button>Simpan wilayah</button></form><p class="note">Pada form Distribusi, Penjualan, Pengalihan, dan Pengembalian, pilihan wilayah otomatis mengikuti wilayah petugas yang dipilih.</p></div>'}

function wilPick(sel){sel=sel||[];return S.wil.length?'<details class="dd"><summary>'+(sel.length?esc(sel.join(', ')):'Pilih wilayah')+'</summary><div class="ddl">'+S.wil.map(function(w){return '<label class="ck"><input type="checkbox" name="wil" value="'+esc(w)+'"'+(sel.indexOf(w)>=0?' checked':'')+' onchange="ddSum(this)"> '+esc(w)+'</label>'}).join('')+'</div></details>':'<span class="note">Belum ada wilayah. Tambahkan dulu di menu Wilayah Distribusi.</span>'}

function addOff(e){e.preventDefault();var f=new FormData(e.target),n=f.get('nama').trim(),em=(f.get('email')||'').trim(),pw=f.get('pw')||'';
 if(S.off.some(function(o){return o.nama.toLowerCase()===n.toLowerCase()}))return toast('Nama petugas sudah ada'),false;
 if(em&&pw.length<6)return toast('Kata sandi minimal 6 karakter'),false;
 var w=f.getAll('wil').filter(function(x){return S.wil.indexOf(x)>=0});
 wr(async function(){var r=await DB.from('petugas').insert({nama:n,hp:f.get('hp')||'',alamat:f.get('alamat')||'',wil:w,mulai:f.get('mulai')||'',status:f.get('status'),ket:f.get('ket')||''});if(r.error)throw r.error;if(em)await mkUser(em,pw,{role:'petugas',petugas_nama:n,nama:n});await sync();toast('Petugas disimpan')});return false}
